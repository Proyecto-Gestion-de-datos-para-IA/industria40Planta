services:
  # 1. KAFKA (Modo KRaft estable)
  kafka:
    image: apache/kafka:3.7.0
    container_name: iot-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://iot-kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@iot-kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      - red-industria

  # 2. DATA LAKE (MinIO)
  minio:
    image: minio/minio:latest
    container_name: iot-datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    networks:
      - red-industria

  # 3. POSTGRES
  postgres:
    image: postgres:15-alpine
    container_name: iot-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=industria40
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red-industria

  # 4. APLICACIÓN SPARK
  spark-app:
    build:
      context: ./procesamiento_spark
    container_name: iot-spark-app
    depends_on:
      - kafka
      - postgres
    networks:
      - red-industria

  # 5. SIMULADOR DE SENSORES
  sensor-app:
    build:
      context: ./simulador_iot
    container_name: iot-simulador
    depends_on:
      - kafka
    networks:
      - red-industria

  api-backend:
    build: ./api_backend
    container_name: api-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - red-industria

  dashboard-web:
    build: ./dashboard_web
    container_name: dashboard-web
    ports:
      - "8501:8501"
    depends_on:
      - api-backend
    networks:
      - red-industria

networks:
  red-industria:
    driver: bridge
